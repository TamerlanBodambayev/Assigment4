<!DOCTYPE html>
<html>
<head>
    <title>{{ 'Небезопасный' if form_type == 'insecure' else 'Безопасный' }} Вход</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 500px; margin: 0 auto; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"] { 
            width: 100%; padding: 8px; margin: 5px 0; 
        }
        button { 
            background-color: {{ '#ff4444' if form_type == 'insecure' else '#44ff44' }};
            color: white; padding: 10px 20px; border: none; cursor: pointer;
        }
        .warning { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ '⚠️ Небезопасный' if form_type == 'insecure' else '✅ Безопасный' }} Вход</h1>
        
        {% if form_type == 'insecure' %}
        <div class="warning">
            ⚠️ Этот вход уязвим к SQL-инъекциям!<br>
            Попробуйте: admin' OR '1'='1
        </div>
        {% else %}
        <div class="success">
            ✅ Этот вход защищен от SQL-инъекций
        </div>
        {% endif %}
        
        <form method="POST">
            <div class="form-group">
                <label>Имя пользователя:</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Пароль:</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Войти</button>
        </form>
        
        <p><a href="/">← Назад к выбору</a></p>
    </div>
</body>
</html>
